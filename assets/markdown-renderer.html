<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGENT Diagram Display</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --panel: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --success: #1a7f37;
      --success-soft: #dafbe1;
      --warning: #9a6700;
      --warning-soft: #fff8c5;
      --danger: #cf222e;
      --danger-soft: #ffebe9;
      --code-bg: #f6f8fa;
      --shadow: 0 12px 28px rgba(31, 35, 40, 0.08);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-soft: #102a43;
      --success: #3fb950;
      --success-soft: #12341f;
      --warning: #d29922;
      --warning-soft: #3a2d0b;
      --danger: #f85149;
      --danger-soft: #3d1515;
      --code-bg: #0d1117;
      --shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
    }

    body[data-theme="paper"] {
      --bg: #f8f5ef;
      --panel: #fffdf8;
      --border: #ded4c7;
      --text: #2f2a24;
      --muted: #70675c;
      --accent: #7c3aed;
      --accent-soft: #eee7ff;
      --code-bg: #f3eee7;
    }

    body[data-theme="terminal"] {
      color-scheme: dark;
      --bg: #050807;
      --panel: #0b120f;
      --border: #1d3b2a;
      --text: #d8ffe7;
      --muted: #83b796;
      --accent: #41f07f;
      --accent-soft: #0e2a18;
      --success: #41f07f;
      --success-soft: #0e2a18;
      --warning: #f7d774;
      --warning-soft: #2c250d;
      --danger: #ff6b6b;
      --danger-soft: #321314;
      --code-bg: #060b08;
      --shadow: 0 0 28px rgba(65, 240, 127, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
    }

    .title {
      min-width: 0;
    }

    .title strong {
      display: block;
      font-size: 15px;
    }

    .title span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button,
    select,
    label.file-button {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 56px;
    }

    .status {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-button {
      max-width: 240px;
      white-space: nowrap;
    }

    .tab-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .markdown-body {
      min-height: 70vh;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .markdown-body h1,
    .markdown-body h2 {
      border-bottom-color: var(--border);
    }

    .markdown-body a {
      color: var(--accent);
    }

    .markdown-body blockquote {
      color: var(--muted);
      border-left-color: var(--border);
    }

    .markdown-body pre,
    .markdown-body code {
      background-color: var(--code-bg);
      color: var(--text);
    }

    .markdown-body pre {
      overflow: auto;
    }

    .markdown-body .contains-task-list {
      padding-left: 0;
    }

    .mermaid-box {
      margin: 16px 0;
      padding: 16px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
    }

    .diagram-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .zoomable-image {
      cursor: zoom-in;
    }

    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.72);
    }

    .zoom-overlay.open {
      display: grid;
    }

    .zoom-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1480px;
      width: min(100%, 1480px);
      margin: 0 auto;
      color: #ffffff;
    }

    .zoom-head strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .zoom-stage {
      display: grid;
      place-items: center;
      overflow: auto;
      max-width: 1480px;
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      background: #ffffff;
    }

    .zoom-stage > * {
      max-width: none;
    }

    .zoom-stage svg,
    .zoom-stage img {
      max-width: none;
      height: auto;
    }

    details.mermaid-source {
      margin: 8px 0 20px;
    }

    .tlndr-progress,
    .tlndr-snapshot,
    .tlndr-panel {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .tlndr-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .tlndr-progress-head strong {
      color: var(--text);
      font-size: 15px;
    }

    .tlndr-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tlndr-steps li {
      position: relative;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .tlndr-steps li span,
    .tlndr-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .tlndr-steps li span {
      min-width: 22px;
      margin-bottom: 8px;
      background: var(--border);
      color: var(--text);
    }

    .tlndr-steps li strong,
    .tlndr-steps li em {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .tlndr-steps li strong {
      font-size: 13px;
    }

    .tlndr-steps li em {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
    }

    .tlndr-steps li.done {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .tlndr-steps li.done span,
    .tlndr-badge.locked,
    .tlndr-badge.ai {
      background: var(--success);
      color: #ffffff;
    }

    .tlndr-steps li.current {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .tlndr-steps li.current span {
      background: var(--accent);
      color: #ffffff;
    }

    .tlndr-snapshot {
      display: grid;
      gap: 8px;
    }

    .tlndr-snapshot-row {
      display: grid;
      grid-template-columns: auto minmax(90px, 150px) 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .tlndr-badge.pending {
      background: var(--warning);
      color: #ffffff;
    }

    .tlndr-badge.risk,
    .tlndr-badge.manual {
      background: var(--danger);
      color: #ffffff;
    }

    .tlndr-panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    #editor {
      display: none;
      width: 100%;
      min-height: 40vh;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    body.editing #editor {
      display: block;
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }

      .markdown-body {
        padding: 18px;
      }

      .tlndr-steps,
      .tlndr-snapshot-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <strong id="app-title">AGENT Diagram Display</strong>
      <span id="source-label">No source loaded</span>
    </div>
    <div class="controls">
      <button id="refresh" type="button">Refresh</button>
      <select id="theme-select" aria-label="Theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="paper">Paper</option>
        <option value="terminal">Terminal</option>
      </select>
      <button id="toggle-editor" type="button">Edit Markdown</button>
      <label class="file-button" for="file-input">Open File</label>
      <input id="file-input" type="file" accept=".md,.markdown,text/markdown,text/plain">
      <button id="render-editor" class="primary" type="button">Render</button>
    </div>
  </header>
  <main>
    <nav id="tabs" class="tabs" aria-label="Markdown pages"></nav>
    <div id="status" class="status">Loading...</div>
    <textarea id="editor" spellcheck="false"></textarea>
    <article id="preview" class="markdown-body"></article>
  </main>
  <div id="zoom-overlay" class="zoom-overlay" role="dialog" aria-modal="true" aria-labelledby="zoom-title">
    <div class="zoom-head">
      <strong id="zoom-title">Diagram preview</strong>
      <button id="zoom-close" type="button">Close</button>
    </div>
    <div id="zoom-stage" class="zoom-stage"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const editor = document.getElementById("editor");
    const sourceLabel = document.getElementById("source-label");
    const appTitle = document.getElementById("app-title");
    const tabsEl = document.getElementById("tabs");
    const params = new URLSearchParams(window.location.search);
    const sourceUrl = params.get("src");
    const sourceTitle = params.get("title");
    const themeSelect = document.getElementById("theme-select");
    const requestedLanguage = (params.get("lang") || "auto").toLowerCase();
    const detectedLanguage = requestedLanguage === "auto" ? (navigator.language || "en") : requestedLanguage;
    const uiLanguage = detectedLanguage.toLowerCase().startsWith("zh") ? "zh" : "en";
    const labels = {
      zh: {
        appTitle: "AGENT图表展示",
        noSource: "未加载来源",
        manual: "手动输入",
        defaultMarkdown: "# Markdown Renderer\n\n在编辑器粘贴 Markdown，或打开本地 `.md` 文件。",
        sourceFallback: "Markdown 工件",
        rendered: "已渲染",
        characters: "字符",
        refreshing: "刷新中...",
        sourceSuffix: "来源",
        zoom: "放大查看",
        close: "关闭",
        diagramPreview: "图表预览",
        imagePreview: "图片预览",
      },
      en: {
        appTitle: "AGENT Diagram Display",
        noSource: "No source loaded",
        manual: "Manual input",
        defaultMarkdown: "# Markdown Renderer\n\nPaste Markdown in the editor or open a local `.md` file.",
        sourceFallback: "Markdown artifact",
        rendered: "Rendered",
        characters: "characters",
        refreshing: "Refreshing...",
        sourceSuffix: "source",
        zoom: "Zoom",
        close: "Close",
        diagramPreview: "Diagram preview",
        imagePreview: "Image preview",
      },
    }[uiLanguage];
    let currentMarkdown = "";
    let tabs = [];
    let activeTabId = null;
    let renderSerial = 0;

    document.documentElement.lang = uiLanguage === "zh" ? "zh-CN" : "en";
    document.title = labels.appTitle;
    appTitle.textContent = labels.appTitle;
    sourceLabel.textContent = labels.noSource;
    document.getElementById("zoom-title").textContent = labels.diagramPreview;
    document.getElementById("zoom-close").textContent = labels.close;

    function currentMermaidTheme(theme) {
      return theme === "dark" || theme === "terminal" ? "dark" : "default";
    }

    function getHighlighter() {
      const candidate = window.hljs || globalThis.hljs;
      if (!candidate || typeof candidate.highlightElement !== "function") {
        return null;
      }
      return candidate;
    }

    function highlightCodeBlocks(root) {
      const highlighter = getHighlighter();
      if (!highlighter) {
        return;
      }

      root.querySelectorAll("pre code:not(.language-mermaid):not(.lang-mermaid)").forEach((block) => {
        try {
          highlighter.highlightElement(block);
        } catch (error) {
          console.warn("Skipping syntax highlight for one code block.", error);
        }
      });
    }

    function highlightForMarked(code, language) {
      const highlighter = getHighlighter();
      if (!highlighter || typeof highlighter.highlight !== "function") {
        return escapeHtml(code);
      }

      try {
        const validLanguage = language && highlighter.getLanguage(language) ? language : "plaintext";
        return highlighter.highlight(code, { language: validLanguage }).value;
      } catch (error) {
        console.warn("Falling back to escaped code block.", error);
        return escapeHtml(code);
      }
    }

    function applyTheme(theme) {
      const selected = theme || "light";
      document.body.dataset.theme = selected;
      themeSelect.value = selected;
      localStorage.setItem("tlndr-renderer-theme", selected);
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: currentMermaidTheme(selected) });
    }

    applyTheme(params.get("theme") || localStorage.getItem("tlndr-renderer-theme") || "light");

    marked.use({
      gfm: true,
      breaks: false,
      pedantic: false,
      mangle: false,
      headerIds: true,
      highlight(code, language) {
        return highlightForMarked(code, language);
      }
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char]));
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function openZoom(content, title) {
      const overlay = document.getElementById("zoom-overlay");
      const stage = document.getElementById("zoom-stage");
      const zoomTitle = document.getElementById("zoom-title");
      stage.innerHTML = "";
      stage.appendChild(content.cloneNode(true));
      zoomTitle.textContent = title;
      overlay.classList.add("open");
    }

    function closeZoom() {
      const overlay = document.getElementById("zoom-overlay");
      const stage = document.getElementById("zoom-stage");
      overlay.classList.remove("open");
      stage.innerHTML = "";
    }

    function attachZoomButton(target, title) {
      if (target.dataset.zoomAttached === "true") {
        return;
      }

      const toolbar = document.createElement("div");
      toolbar.className = "diagram-toolbar";
      const zoomButton = document.createElement("button");
      zoomButton.type = "button";
      zoomButton.textContent = labels.zoom;
      toolbar.appendChild(zoomButton);
      target.before(toolbar);
      target.dataset.zoomAttached = "true";
      zoomButton.addEventListener("click", () => {
        openZoom(target, title);
      });
    }

    function normalizeSource(src) {
      if (!src) {
        return "";
      }
      const resolved = new URL(src, window.location.origin);
      return `${resolved.pathname}${resolved.search}`;
    }

    async function hashContent(content) {
      if (window.crypto && crypto.subtle) {
        const bytes = new TextEncoder().encode(content);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      let hash = 0;
      for (let index = 0; index < content.length; index += 1) {
        hash = ((hash << 5) - hash + content.charCodeAt(index)) | 0;
      }
      return `fallback-${Math.abs(hash)}`;
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      tabs.forEach((tab) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = tab.id === activeTabId ? "tab-button active" : "tab-button";
        button.textContent = tab.title;
        button.title = `${tab.title}\n${tab.sourceLabel}`;
        button.addEventListener("click", async () => {
          await activateTab(tab.id);
        });
        tabsEl.appendChild(button);
      });
    }

    function tabTitleFromSource(src, title) {
      if (title) {
        return title;
      }
      if (!src) {
        return labels.manual;
      }
      const pathname = new URL(src, window.location.origin).pathname;
      return decodeURIComponent(pathname.split("/").pop() || labels.sourceFallback);
    }

    function getActiveTab() {
      return tabs.find((candidate) => candidate.id === activeTabId) || null;
    }

    async function activateTab(tabId) {
      const tab = tabs.find((candidate) => candidate.id === tabId);
      if (!tab) {
        return;
      }

      activeTabId = tab.id;
      currentMarkdown = tab.markdown;
      editor.value = currentMarkdown;
      sourceLabel.textContent = `${tab.sourceLabel}`;
      renderTabs();
      await renderMarkdown(currentMarkdown);
    }

    async function upsertTab({ src, title, markdown, sourceLabelText }) {
      const normalizedSrc = normalizeSource(src);
      const contentHash = await hashContent(markdown);
      const sameSource = normalizedSrc ? tabs.find((tab) => tab.src === normalizedSrc) : null;
      if (sameSource) {
        const duplicate = tabs.find((tab) => tab !== sameSource && tab.contentHash === contentHash);
        if (duplicate) {
          tabs = tabs.filter((tab) => tab !== sameSource);
          duplicate.src = duplicate.src || normalizedSrc;
          duplicate.sourceLabel = duplicate.sourceLabel || sourceLabelText || normalizedSrc;
          await activateTab(duplicate.id);
          return duplicate;
        }

        sameSource.id = contentHash;
        sameSource.contentHash = contentHash;
        sameSource.markdown = markdown;
        sameSource.title = tabTitleFromSource(src, title);
        sameSource.sourceLabel = sourceLabelText || (title ? `${title} - ${normalizedSrc}` : normalizedSrc);
        await activateTab(sameSource.id);
        return sameSource;
      }

      const existing = tabs.find((tab) => tab.contentHash === contentHash);
      if (existing) {
        existing.src = existing.src || normalizedSrc;
        existing.title = existing.title || tabTitleFromSource(src, title);
        existing.sourceLabel = existing.sourceLabel || sourceLabelText || existing.src || labels.manual;
        await activateTab(existing.id);
        return existing;
      }

      const tab = {
        id: contentHash,
        contentHash,
        markdown,
        src: normalizedSrc,
        title: tabTitleFromSource(src, title),
        sourceLabel: sourceLabelText || (title && normalizedSrc ? `${title} - ${normalizedSrc}` : normalizedSrc) || labels.manual,
      };
      tabs.push(tab);
      await activateTab(tab.id);
      return tab;
    }

    function transformMermaidBlocks(root) {
      const blocks = root.querySelectorAll("pre > code.language-mermaid, pre > code.lang-mermaid");
      blocks.forEach((codeBlock) => {
        const source = codeBlock.textContent;
        const container = document.createElement("div");
        container.className = "mermaid-box";

        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = source;
        container.appendChild(diagram);

        const details = document.createElement("details");
        details.className = "mermaid-source";
        const summary = document.createElement("summary");
        summary.textContent = "Mermaid source";
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = source;
        pre.appendChild(code);
        details.appendChild(summary);
        details.appendChild(pre);
        container.appendChild(details);

        codeBlock.parentElement.replaceWith(container);
        attachZoomButton(container, labels.diagramPreview);
      });
    }

    function enableImageZoom(root) {
      root.querySelectorAll("img").forEach((image) => {
        image.classList.add("zoomable-image");
        image.title = labels.zoom;
        image.addEventListener("click", () => {
          openZoom(image, image.alt || labels.imagePreview);
        });
      });
    }

    function enableNativeVisualZoom(root) {
      root.querySelectorAll(".tlndr-diagram, .tlndr-chart, .tlndr-visual").forEach((visual) => {
        attachZoomButton(visual, visual.getAttribute("aria-label") || labels.diagramPreview);
      });
    }

    async function loadMarkdownSource(src, title) {
      const normalizedSrc = normalizeSource(src);
      const separator = normalizedSrc.includes("?") ? "&" : "?";
      const response = await fetch(`${normalizedSrc}${separator}_=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to load ${normalizedSrc}: HTTP ${response.status}`);
      }
      const markdown = await response.text();
      const label = title ? `${title} - ${normalizedSrc}` : normalizedSrc;
      return upsertTab({ src: normalizedSrc, title, markdown, sourceLabelText: label });
    }

    function rewriteMarkdownLinks(root) {
      const activeTab = getActiveTab();
      if (!activeTab || !activeTab.src) {
        return;
      }

      const sourceBase = new URL(activeTab.src, window.location.origin);
      root.querySelectorAll("a[href]").forEach((link) => {
        const rawHref = link.getAttribute("href");
        if (!rawHref || rawHref.startsWith("#")) {
          return;
        }

        let target;
        try {
          target = new URL(rawHref, sourceBase);
        } catch {
          return;
        }

        if (target.origin !== window.location.origin || !target.pathname.toLowerCase().match(/\.m(arkdown|d)$/)) {
          return;
        }

        const nextParams = new URLSearchParams();
        nextParams.set("src", `${target.pathname}${target.search}`);
        nextParams.set("title", link.textContent.trim() || target.pathname.split("/").pop() || labels.sourceFallback);
        link.href = `/?${nextParams.toString()}`;
        link.target = "_self";
        link.addEventListener("click", async (event) => {
          event.preventDefault();
          try {
            setStatus(labels.refreshing);
            await loadMarkdownSource(`${target.pathname}${target.search}`, link.textContent.trim() || target.pathname.split("/").pop() || labels.sourceFallback);
          } catch (error) {
            setStatus(error.message || String(error));
          }
        });
      });
    }

    async function renderMarkdown(markdown) {
      renderSerial += 1;
      const serial = renderSerial;
      const dirty = marked.parse(markdown);
      const clean = DOMPurify.sanitize(dirty, {
        ADD_ATTR: ["target", "rel", "class", "checked"]
      });
      preview.innerHTML = clean;
      transformMermaidBlocks(preview);
      rewriteMarkdownLinks(preview);
      enableImageZoom(preview);
      enableNativeVisualZoom(preview);
      highlightCodeBlocks(preview);
      try {
        await mermaid.run({ nodes: preview.querySelectorAll(".mermaid") });
      } catch (error) {
        console.error(error);
        if (serial === renderSerial) {
          setStatus(`Rendered Markdown, but Mermaid reported: ${error.message || error}`);
        }
        return;
      }
      if (serial === renderSerial) {
        setStatus(`${labels.rendered} ${markdown.length.toLocaleString()} ${labels.characters}`);
      }
    }

    async function loadFromSource(src = sourceUrl, title = sourceTitle) {
      if (!src) {
        await upsertTab({
          src: "",
          title: labels.manual,
          markdown: labels.defaultMarkdown,
          sourceLabelText: labels.manual,
        });
        return;
      }

      await loadMarkdownSource(src, title);
    }

    document.getElementById("refresh").addEventListener("click", async () => {
      try {
        setStatus(labels.refreshing);
        const activeTab = getActiveTab();
        if (activeTab && activeTab.src) {
          await loadMarkdownSource(activeTab.src, activeTab.title);
        } else {
          await loadFromSource();
        }
      } catch (error) {
        setStatus(error.message || String(error));
      }
    });

    themeSelect.addEventListener("change", async () => {
      applyTheme(themeSelect.value);
      await renderMarkdown(currentMarkdown);
    });

    document.getElementById("toggle-editor").addEventListener("click", () => {
      document.body.classList.toggle("editing");
    });

    document.getElementById("render-editor").addEventListener("click", async () => {
      currentMarkdown = editor.value;
      await upsertTab({
        src: "",
        title: labels.manual,
        markdown: currentMarkdown,
        sourceLabelText: labels.manual,
      });
    });

    document.getElementById("file-input").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }
      currentMarkdown = await file.text();
      await upsertTab({
        src: "",
        title: file.name,
        markdown: currentMarkdown,
        sourceLabelText: `${file.name} - ${labels.sourceSuffix}`,
      });
    });

    document.getElementById("zoom-close").addEventListener("click", closeZoom);
    document.getElementById("zoom-overlay").addEventListener("click", (event) => {
      if (event.target.id === "zoom-overlay") {
        closeZoom();
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeZoom();
      }
    });

    try {
      await loadFromSource();
    } catch (error) {
      setStatus(error.message || String(error));
      preview.innerHTML = `<pre><code>${escapeHtml(error)}</code></pre>`;
    }
  </script>
</body>
</html>
